  <script>

async function downloadReport() {

  if (!window.latestMatchData) {

    alert(
      "No report available yet."
    );

    return;
  }

  const {
    jsPDF
  } = window.jspdf;

  const doc =
    new jsPDF();

  // GET DATA
  const data =
    window.latestMatchData;

  // SAFE VALUES
  const matchScore =
    data.matchScore || 0;

  const matchedSkills =
    data.matchedSkills || [];

  const missingSkills =
    data.missingSkills || [];

  const recommendation =
    data.recommendation || "";

  // TITLE
  doc.setFontSize(24);

  doc.text(
    "SAP AI Resume Report",
    20,
    30
  );

  // SCORE
  doc.setFontSize(16);

  doc.text(
    `Match Score: ${matchScore}%`,
    20,
    60
  );

  // MATCHED
  doc.text(
    "Matched Skills:",
    20,
    90
  );

  doc.setFontSize(13);

  doc.text(
    matchedSkills.join(", "),
    20,
    105
  );

  // MISSING
  doc.setFontSize(16);

  doc.text(
    "Missing Skills:",
    20,
    140
  );

  doc.setFontSize(13);

  doc.text(
    missingSkills.join(", ") || "None",
    20,
    155
  );

  // RECOMMENDATION
  doc.setFontSize(16);

  doc.text(
    "Recommendation:",
    20,
    190
  );

  doc.setFontSize(13);

  const splitText =
    doc.splitTextToSize(
      recommendation,
      170
    );

  doc.text(
    splitText,
    20,
    205
  );

  // SAVE PDF
  doc.save(
    "SAP_AI_Report.pdf"
  );
}

function renderMatchDashboard(data) {

  const dashboard =
    document.getElementById(

  dashboard.innerHTML = "";

  // MATCH SCORE
const scoreCard =

scoreCard.className =

scoreCard.innerHTML = `

>

animateScore(

function animateScore(target) {

  const scoreEl =
    document.getElementById(
      "matchScore"
    );

  if (!scoreEl) return;

  target = Math.round(target);

  let current = 0;

  const speed =
    Math.max(
      5,
      150 / target
    );

  const interval =
    setInterval(() => {

      current++;

      scoreEl.innerText =
        current + "%";

      if (current >= target) {

        scoreEl.innerText =
          target + "%";

        clearInterval(
          interval
        );
      }

    }, speed);
}
// MATCHED SKILLS
const matchCard =
  document.createElement("div");

matchCard.className =
  "dashboard-card";

matchCard.innerHTML = `

    (data.matchedSkills || [])
      .map(s =>
        `<span class="skill-tag">
          ${s}
        </span>`
      )
      .join("")
  }
`;

dashboard.appendChild(matchCard);

function addMessage(text, type) {

  if (
    !text ||
    text === "undefined" ||
    text.trim() === ""
  ) {
    return;
  }

  // REMOVE EMPTY STATE
  const empty =
    document.querySelector(
      ".empty-state"
    );

  if (empty) {
    empty.remove();
  }

  // MAIN ROW
  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  // CHAT BUBBLE
  const content =
    document.createElement("div");

  content.className =
    "chat-item";

  div.appendChild(content);

  messagesDiv.appendChild(div);

  // =========================
  // FORMAT TEXT
  // =========================

  let formattedText = "";

  if (typeof text === "object") {

    formattedText =
      marked.parse(
        JSON.stringify(
          text,
          null,
          2
        )
      );

  } else {

    const cleanText = text

      .replace(/\n{3,}/g, "\n\n")

      .replace(/\n\s+\•/g, "\n•")

      .replace(/\n(?=#+)/g, "\n");

    formattedText =
      marked.parse(cleanText);
  }

  // =========================
  // USER MESSAGE
  // =========================

  if (type === "user") {

    content.innerHTML =
      formattedText;

    messagesDiv.scrollTop =
      messagesDiv.scrollHeight;

    return;
  }

  // =========================
  // BOT TYPING EFFECT
  // =========================

  let i = 0;

  const speed = 5;

  const temp =
    document.createElement("div");

  temp.innerHTML =
    formattedText;

  const finalHTML =
    temp.innerHTML;

  const interval =
